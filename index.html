<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" href="fav.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gisul39 | Article List</title>
    
    <link rel="icon" href="./fav.png" type="image/png">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&display=swap">

    <style>
        /* デザイン変数・テーマ設定 */
        :root {
            --bg: #f7f9fb;
            --text: #1a1c1e;
            --primary: #4A90E2;
            --card-bg: #f0f1f3;
            --btn-bg: #2c5688;
            --btn-text: #e8ecf0;
            --logo-filter: brightness(0);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1d2024;
                --text: #e2e2e9;
                --primary: #82b1ff;
                --card-bg: #2a2d32;
                --btn-bg: #82b1ff;
                --btn-text: #1d2024;
                --logo-filter: brightness(0) invert(1);
            }
        }

        body {
            font-family: 'Shippori Mincho', serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.8;
            transition: background-color 0.3s ease;
        }

        /* Heroエリア */
        .hero {
            width: 100%;
            height: 45vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-logo {
            width: 180px;
            height: auto;
            filter: var(--logo-filter);
            transition: filter 0.3s ease;
        }

        /* コンテンツ・リスト構造 */
        .content-inner {
            padding: 0 24px;
            max-width: 700px;
            margin: 0 auto;
        }

        .article-link {
            display: block;
            text-decoration: none;
            color: inherit;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        /* サムネイル画像のスタイル */
        .article-thumbnail {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 16px;
            background-color: rgba(0,0,0,0.05);
            display: block;
        }

        .article-date {
            font-size: 0.85rem;
            opacity: 0.6;
            margin-bottom: 8px;
            display: block;
        }

        .article-title {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
        }

        /* スクロールアニメーション */
        .article-link {
            view-timeline-name: --item-scroll;
            view-timeline-axis: block;
            animation: reveal linear both;
            animation-timeline: --item-scroll;
            animation-range: entry 0% exit 100%;
        }

        @keyframes reveal {
            0% { filter: blur(10px); opacity: 0; transform: translateY(20px); }
            15%, 85% { filter: blur(0px); opacity: 1; transform: translateY(0); }
            100% { filter: blur(10px); opacity: 0; transform: translateY(-20px); }
        }

        /* フッターボタン */
        .footer-actions {
            padding: 80px 24px 15vh;
            display: flex;
            justify-content: center;
        }
        .back-btn {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border-radius: 50px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .back-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="hero">
        <img src="./main.svg" alt="Gisul39" class="hero-logo">
    </div>

    <div class="content-inner" id="list-output">
        <p style="text-align: center; opacity: 0.5;">Loading articles...</p>
    </div>

    <div class="footer-actions">
        <button class="back-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            ページ上部へ戻る
        </button>
    </div>

    <script>
        async function loadArticles() {
            const container = document.getElementById('list-output');
            
            try {
                const response = await fetch('./info.md');
                if (!response.ok) throw new Error('info.md not found');
                
                const text = await response.text();
                // 空行を除去して配列化
                const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                
                let htmlContent = '';

                // 3行1セット（#タイトル、日付、ファイルid）でループ
                for (let i = 0; i < lines.length; i += 3) {
                    const title = lines[i]?.replace(/^#\s*/, '') || 'Untitled';
                    const date = lines[i + 1] || 'Unknown Date';
                    const fileId = lines[i + 2] || '';

                    if (fileId) {
                        // 記事IDに基づいた画像パス
                        const imageSrc = `./img/${fileId}.webp`;

                        htmlContent += `
                            <a href="./docs.html?file=${fileId}" class="article-link">
                                <img src="${imageSrc}" 
                                     alt="${title}" 
                                     class="article-thumbnail" 
                                     onerror="this.style.display='none';">
                                <span class="article-date">${date}</span>
                                <h2 class="article-title">${title}</h2>
                            </a>
                        `;
                    }
                }

                container.innerHTML = htmlContent || '<p>記事がありません。</p>';
                
            } catch (error) {
                console.error(error);
                container.innerHTML = `<p style="text-align: center; color: red;">エラー: 記事リストの読み込みに失敗しました。</p>`;
            }
        }

        // 実行
        loadArticles();
    </script>
</body>
</html>
