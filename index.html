}

    .product-grid{
      max-width:1040px;
      margin:8px auto 0;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
      gap:12px;
    }
    .product-link{
      background:#eff0f1;
      border-radius:100px;
      padding:12px 14px;
      display:grid;
      grid-template-columns:56px 1fr;
      align-items:center;
      gap:12px;
      transition:transform .25s ease, box-shadow .25s ease;
    }
    .product-link:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 24px #00000005;
    }
    .product-link img{
      width:56px;
      height:56px;
      border-radius:100px;
      object-fit:cover;
      background:#fff
    }
    .product-label{
      font-size:17px;
      font-weight:700;
      color:#12201d;
      text-align:left;
      line-height:1.3;
    }
    @media (max-width:720px){
      .product-title{
        font-size:32px;
      }
      h3.product-title{font-size:24px;}
      .product-grid{
        grid-template-columns:1fr;
      }
    }
